name: Laravel CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # Runs every time you push to main

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # Match your Azure PHP version
          extensions: mbstring, dom, curl, libxml, sqlite3
          
      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Run Tests
        run: php artisan test # The "Quality Gate" - if this fails, deployment stops

  deploy:
    runs-on: ubuntu-latest
    needs: laravel-tests # Only runs if tests pass
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'your-azure-app-name' # Replace with your actual app name
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .